services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: shop
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d shop"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./api
    environment:
      DATABASE_URL: postgresql://app:app@db:5432/shop?schema=public
      PORT: "4000"
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in the .env file}
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "npx prisma migrate deploy && node dist/server.js"
    ports:
      - "4000:4000"

  ngapp:
    build: ./ngapp
    ports:
      - "4200:80"
    depends_on:
      - api

  nxapp:
    build: ./nxapp
    environment:
      API_URL: http://api:4000/api
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  pgdata:

