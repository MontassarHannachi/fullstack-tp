<div class="container py-4" style="max-width: 420px">
  <h1 class="h3 mb-4">Login</h1>

  @if (error()) {
    <div class="alert alert-danger">{{ error() }}</div>
  }

  <form [formGroup]="form" (ngSubmit)="submit()" class="d-grid gap-3">
    <div>
      <label class="form-label">Email</label>
      <input class="form-control" type="email" formControlName="email" autocomplete="username" />
    </div>
    <div>
      <label class="form-label">Password</label>
      <input class="form-control" type="password" formControlName="password" autocomplete="current-password" />
    </div>
    <button type="submit" class="btn btn-primary" [disabled]="form.invalid">Sign in</button>
  </form>
</div>
